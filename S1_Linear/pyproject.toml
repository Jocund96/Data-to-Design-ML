[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-to-design-s1-linear"
version = "0.1.0"
description = "Linear-family concrete compressive-strength experiments"
requires-python = ">=3.11"
dependencies = [
    "ipykernel==7.3.0",
    "joblib==1.5.3",
    "jupyter==1.1.1",
    "matplotlib==3.11.0",
    "nbconvert==7.17.1",
    "notebook==7.6.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.0",
    "shap==0.52.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
